<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>My Love Code</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;800&family=Quicksand:wght@500;600&display=swap" rel="stylesheet">
<style>
  html, body {
    margin: 0;
    padding: 0;
    background: #050005;
    overflow: hidden;
    height: 100%;
    width: 100%;
  }
  canvas {
    display: block;
    position: fixed;
    top: 0;
    left: 0;
  }
  #vignette {
    position: fixed;
    inset: 0;
    pointer-events: none;
    background: radial-gradient(ellipse at center, rgba(0,0,0,0) 55%, rgba(0,0,0,0.45) 100%);
    z-index: 3;
  }
  #glow {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 1;
    opacity: 0;
    background: radial-gradient(circle at 50% 46%, rgba(255,60,110,0.16) 0%, rgba(255,60,110,0.05) 30%, rgba(0,0,0,0) 60%);
    transition: opacity 1.2s ease;
  }
  #scene {
    position: fixed;
    inset: 0;
    z-index: 2;
  }
  #scene.breathe {
    animation: breathe 3.6s ease-in-out infinite;
  }
  @keyframes breathe {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.025); }
  }
  #fx {
    position: fixed;
    inset: 0;
    z-index: 5;
    pointer-events: none;
  }
  #tap {
    position: fixed;
    bottom: 9%;
    left: 50%;
    transform: translateX(-50%);
    color: #ffd7e3;
    font-family: 'Quicksand', sans-serif;
    font-weight: 600;
    font-size: 12px;
    letter-spacing: 3px;
    opacity: 0;
    text-transform: uppercase;
    z-index: 6;
    pointer-events: none;
    padding: 10px 22px;
    border: 1px solid rgba(255,180,205,0.45);
    border-radius: 999px;
    backdrop-filter: blur(6px);
    background: rgba(255,90,140,0.08);
  }
  #tap.show {
    animation: pulse 2.4s infinite;
  }
  @keyframes pulse {
    0%, 100% { opacity: 0.35; box-shadow: 0 0 0px rgba(255,110,150,0); }
    50% { opacity: 0.95; box-shadow: 0 0 18px rgba(255,110,150,0.35); }
  }
  #replayBtn {
    position: fixed;
    bottom: 3%;
    left: 50%;
    transform: translateX(-50%);
    color: #ffb8ce;
    font-family: 'Quicksand', sans-serif;
    font-weight: 600;
    font-size: 10px;
    letter-spacing: 2px;
    text-transform: uppercase;
    z-index: 7;
    pointer-events: none;
    opacity: 0;
    padding: 6px 16px;
    border: 1px solid rgba(255,180,205,0.25);
    border-radius: 999px;
    background: rgba(20,4,10,0.35);
    backdrop-filter: blur(4px);
    transition: opacity 0.6s ease;
  }
  #replayBtn.show {
    opacity: 0.6;
    pointer-events: auto;
  }
  #replayBtn.show:active {
    opacity: 1;
  }
</style>
</head>
<body>

<canvas id="bokeh"></canvas>
<canvas id="rain"></canvas>
<div id="glow"></div>
<div id="scene">
  <canvas id="text"></canvas>
</div>
<canvas id="fx"></canvas>
<div id="vignette"></div>
<div id="tap">tap to send a kiss</div>
<div id="replayBtn">replay</div>

<script>
/* ============ SEQUENCE — edit here ============ */
const SEQUENCE = [
  { text: "3",              hold: 550,  big: true },
  { text: "2",               hold: 550,  big: true },
  { text: "1",                hold: 550,  big: true },
  { text: "My Wifeyy",       hold: 1250 },
  { text: "My Buggu",        hold: 1250 },
  { text: "My love",         hold: 1250 },
  { text: "My Janu",         hold: 1250 },
  { text: "My Jan",          hold: 1250 },
  { text: "mera bacha",      hold: 1250 },
  { text: "I love you soo muchhh mera bacha", hold: 999999, final: true }
];
/* ================================================= */

const bokehCanvas = document.getElementById('bokeh');
const bctx = bokehCanvas.getContext('2d');
const rainCanvas = document.getElementById('rain');
const rctx = rainCanvas.getContext('2d');
const textCanvas = document.getElementById('text');
const tctx = textCanvas.getContext('2d');
const fxCanvas = document.getElementById('fx');
const fctx = fxCanvas.getContext('2d');
const sceneEl = document.getElementById('scene');
const glowEl = document.getElementById('glow');
const tapEl = document.getElementById('tap');
const replayBtn = document.getElementById('replayBtn');

function resize() {
  [bokehCanvas, rainCanvas, textCanvas, fxCanvas].forEach(c => {
    c.width = window.innerWidth;
    c.height = window.innerHeight;
  });
}
resize();
window.addEventListener('resize', () => { resize(); buildAll(); initBokeh(); });

/* ---------------- EASING ---------------- */
function easeOutCubic(t) { return 1 - Math.pow(1 - t, 3); }
function easeInCubic(t) { return t * t * t; }

/* ---------------- BOKEH (soft floating light particles, like the reel) ---------------- */
let bokehParticles = [];
function initBokeh() {
  const count = Math.floor((bokehCanvas.width * bokehCanvas.height) / 26000);
  bokehParticles = [];
  for (let i = 0; i < count; i++) {
    bokehParticles.push({
      x: Math.random() * bokehCanvas.width,
      y: Math.random() * bokehCanvas.height,
      r: 1.5 + Math.random() * 4.5,
      speed: 0.15 + Math.random() * 0.35,
      drift: (Math.random() - 0.5) * 0.25,
      alpha: 0.15 + Math.random() * 0.35,
      hue: Math.random() > 0.5 ? "255,255,255" : "255,140,180"
    });
  }
}
initBokeh();

function drawBokeh() {
  bctx.clearRect(0, 0, bokehCanvas.width, bokehCanvas.height);
  bokehParticles.forEach(p => {
    bctx.beginPath();
    const grad = bctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, p.r * 4);
    grad.addColorStop(0, `rgba(${p.hue},${p.alpha})`);
    grad.addColorStop(1, `rgba(${p.hue},0)`);
    bctx.fillStyle = grad;
    bctx.arc(p.x, p.y, p.r * 4, 0, Math.PI * 2);
    bctx.fill();

    p.y -= p.speed;
    p.x += p.drift;
    if (p.y < -20) {
      p.y = bokehCanvas.height + 20;
      p.x = Math.random() * bokehCanvas.width;
    }
  });
  requestAnimationFrame(drawBokeh);
}

/* ---------------- MATRIX RAIN (fills bottom-up) ---------------- */
const glyphs = Array.from("LOVE❤♥💋");
const fontSize = 16;
let columns, drops, colStartDelay, colAlpha;

function initRain() {
  columns = Math.floor(rainCanvas.width / fontSize);
  drops = [];
  colStartDelay = [];
  colAlpha = [];
  for (let i = 0; i < columns; i++) {
    drops[i] = rainCanvas.height / fontSize + Math.random() * 20;
    colStartDelay[i] = Math.random() * 60;
    colAlpha[i] = 0.55 + Math.random() * 0.45;
  }
}
initRain();

let rainFrame = 0;
function drawRain() {
  rctx.fillStyle = "rgba(0,0,0,0.13)";
  rctx.fillRect(0, 0, rainCanvas.width, rainCanvas.height);
  rctx.font = fontSize + "px monospace";

  for (let i = 0; i < columns; i++) {
    if (rainFrame < colStartDelay[i]) continue;
    let g = glyphs[Math.floor(Math.random() * glyphs.length)];
    if (Math.random() > 0.985) g = "💋";
    const isHeart = g === "❤" || g === "♥";
    const isKiss = g === "💋";
    const a = colAlpha[i];
    rctx.fillStyle = isHeart ? `rgba(255,47,107,${a})` : `rgba(255,120,160,${a * 0.85})`;
    const y = drops[i] * fontSize;
    if (isKiss) {
      rctx.save();
      rctx.globalAlpha = a;
      rctx.fillText(g, i * fontSize, y);
      rctx.restore();
    } else {
      rctx.fillText(g, i * fontSize, y);
    }

    drops[i] -= 0.55 + Math.random() * 0.35;
    if (drops[i] * fontSize < -fontSize && Math.random() > 0.98) {
      drops[i] = rainCanvas.height / fontSize + Math.random() * 20;
    }
  }
  rainFrame++;
  requestAnimationFrame(drawRain);
}

/* ---------------- DOT-MATRIX TEXT SAMPLING ---------------- */
function sampleTextDots(str, fontPx, fontWeight, yCenter, spacing, maxWidth) {
  const off = document.createElement('canvas');
  off.width = textCanvas.width;
  off.height = 400;
  const octx = off.getContext('2d');

  let lines = [];
  octx.font = `${fontWeight} ${fontPx}px Poppins, Arial`;
  if (maxWidth) {
    const words = str.split(" ");
    let line = "";
    for (const w of words) {
      const test = line ? line + " " + w : w;
      if (octx.measureText(test).width > maxWidth && line) {
        lines.push(line);
        line = w;
      } else {
        line = test;
      }
    }
    if (line) lines.push(line);
  } else {
    lines = [str];
  }

  off.height = lines.length * (fontPx + 14) + 40;
  octx.fillStyle = "#fff";
  octx.textAlign = "center";
  octx.textBaseline = "middle";
  octx.font = `${fontWeight} ${fontPx}px Poppins, Arial`;

  lines.forEach((ln, idx) => {
    const ly = 20 + idx * (fontPx + 14) + fontPx / 2;
    octx.fillText(ln, off.width / 2, ly);
  });

  const imgData = octx.getImageData(0, 0, off.width, off.height).data;
  const dots = [];
  for (let y = 0; y < off.height; y += spacing) {
    for (let x = 0; x < off.width; x += spacing) {
      const px = Math.floor(x);
      const py = Math.floor(y);
      const idx = (py * off.width + px) * 4;
      if (imgData[idx + 3] > 120) {
        const cx = x - off.width / 2;
        dots.push({
          baseX: cx,
          y: y - off.height / 2 + yCenter,
          delay: Math.random(),
          angle: Math.random() * Math.PI * 2,
          dist: 40 + Math.random() * 60,
          r: spacing * 0.34
        });
      }
    }
  }
  return dots;
}

/* ---------------- HEART OUTLINE (for final step) — made of tiny hearts ---------------- */
function buildHeartDots(cx, cy, scale) {
  const dots = [];
  const steps = 90;
  for (let i = 0; i < steps; i++) {
    const t = (i / steps) * Math.PI * 2;
    const x = 16 * Math.pow(Math.sin(t), 3);
    const y = -(13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t));
    dots.push({
      cx: cx + x * scale,
      cy: cy + y * scale,
      delay: (i / steps),
      size: scale * (1.6 + Math.random() * 0.8),
      phase: Math.random() * Math.PI * 2
    });
  }
  return dots;
}

/* ---------------- BUILD ALL STEP DOTS ---------------- */
let stepDots = [];
let heartDots = [];
let centerX, centerY;

function buildAll() {
  const isMobile = textCanvas.width < 500;
  centerX = textCanvas.width / 2;
  centerY = textCanvas.height * 0.46;
  stepDots = SEQUENCE.map(step => {
    const size = step.big ? (isMobile ? 130 : 180) : (isMobile ? 38 : 56);
    const weight = 800;
    const spacing = step.big ? (isMobile ? 7 : 9) : (isMobile ? 3.4 : 4.2);
    const maxWidth = textCanvas.width * (step.big ? 0.6 : 0.85);
    return sampleTextDots(step.text, size, weight, centerY, spacing, maxWidth);
  });
  heartDots = buildHeartDots(0, textCanvas.height * 0.44 - centerY, isMobile ? 9 : 13);
}
buildAll();

/* ---------------- TIMING ---------------- */
const RAIN_BUILD_MS = 1700;
const MAT_IN_SHORT = 420;
const MAT_IN_LONG = 700;
const FADE_OUT = 380;
const GAP = 140;

let stepStarts = [];
function computeTimings() {
  let t = RAIN_BUILD_MS;
  stepStarts = [];
  SEQUENCE.forEach(step => {
    const matIn = step.big ? MAT_IN_SHORT : MAT_IN_LONG;
    stepStarts.push(t);
    t += matIn + step.hold + (step.final ? 0 : FADE_OUT + GAP);
  });
}
computeTimings();

let startTime = null;
let finalReached = false;

function drawTextLayer(ts) {
  if (!startTime) startTime = ts;
  const elapsed = ts - startTime;
  tctx.setTransform(1, 0, 0, 1, 0, 0);
  tctx.clearRect(0, 0, textCanvas.width, textCanvas.height);
  tctx.translate(centerX, centerY);

  for (let s = 0; s < SEQUENCE.length; s++) {
    const step = SEQUENCE[s];
    const matIn = step.big ? MAT_IN_SHORT : MAT_IN_LONG;
    const stepStart = stepStarts[s];
    const localT = elapsed - stepStart;
    if (localT < 0) continue;

    let phase, phaseT;
    if (localT < matIn) {
      phase = 'in'; phaseT = localT / matIn;
    } else if (localT < matIn + step.hold) {
      phase = 'hold'; phaseT = 1;
    } else if (!step.final && localT < matIn + step.hold + FADE_OUT) {
      phase = 'out'; phaseT = 1 - easeInCubic((localT - matIn - step.hold) / FADE_OUT);
    } else if (!step.final) {
      continue;
    } else {
      phase = 'hold'; phaseT = 1;
    }

    // heart behind final text
    if (step.final) {
      if (!finalReached) {
        finalReached = true;
        glowEl.style.opacity = '1';
        sceneEl.classList.add('breathe');
      }
      const heartIn = Math.min(1, localT / (matIn * 1.4));
      heartDots.forEach(d => {
        const appear = easeOutCubic(Math.min(1, Math.max(0, (heartIn - d.delay * 0.5) / 0.5)));
        if (appear <= 0) return;
        const pulse = 0.75 + 0.25 * Math.sin(elapsed / 500 + d.phase);
        const s2 = d.size * (0.5 + 0.5 * appear) * pulse;
        tctx.save();
        tctx.globalAlpha = appear * pulse;
        tctx.font = `${Math.max(6, s2)}px Arial`;
        tctx.textAlign = "center";
        tctx.textBaseline = "middle";
        tctx.shadowColor = "#ff2f6b";
        tctx.shadowBlur = 12 * appear;
        tctx.fillStyle = "#ff3f7d";
        tctx.fillText("❤", d.cx, d.cy);
        tctx.restore();
      });
    }

    const dots = stepDots[s];
    const eased = phase === 'in' ? easeOutCubic(phaseT) : phaseT;
    dots.forEach(d => {
      let a;
      if (phase === 'in') {
        a = Math.min(1, Math.max(0, (eased - d.delay * 0.5) / 0.5));
      } else {
        a = eased;
      }
      if (a <= 0.01) return;

      // gentle converge-in motion during "in" phase
      const settle = phase === 'in' ? (1 - easeOutCubic(phaseT)) : 0;
      const dx = Math.cos(d.angle) * d.dist * settle;
      const dy = Math.sin(d.angle) * d.dist * settle;

      tctx.beginPath();
      tctx.fillStyle = `rgba(255,240,244,${a})`;
      tctx.shadowColor = "#ff4d7e";
      tctx.shadowBlur = (step.big ? 14 : 9) * a;
      tctx.arc(d.baseX + dx, d.y + dy - centerY, d.r, 0, Math.PI * 2);
      tctx.fill();
    });

    if (step.final && localT > matIn) {
      tapEl.classList.add('show');
      replayBtn.classList.add('show');
    }
  }

  requestAnimationFrame(drawTextLayer);
}

/* ---------------- KISS BURST FX ---------------- */
let kissBursts = [];

function spawnKissBurst(x, y) {
  const burst = { x, y, born: performance.now(), hearts: [] };
  const n = 10 + Math.floor(Math.random() * 6);
  for (let i = 0; i < n; i++) {
    const angle = Math.random() * Math.PI * 2;
    const speed = 1.2 + Math.random() * 2.4;
    burst.hearts.push({
      angle,
      speed,
      size: 14 + Math.random() * 16,
      spin: (Math.random() - 0.5) * 0.06,
      drift: (Math.random() - 0.5) * 0.4
    });
  }
  kissBursts.push(burst);
}

function drawFx(ts) {
  fctx.clearRect(0, 0, fxCanvas.width, fxCanvas.height);
  const LIFE = 1100;
  kissBursts = kissBursts.filter(b => ts - b.born < LIFE);

  kissBursts.forEach(b => {
    const age = ts - b.born;
    const t = age / LIFE;
    const eased = easeOutCubic(Math.min(1, t));
    const fade = 1 - t;

    // central kiss mark
    if (t < 0.5) {
      const kissScale = easeOutCubic(Math.min(1, age / 220));
      fctx.save();
      fctx.globalAlpha = Math.min(1, fade * 1.6);
      fctx.font = `${44 * (0.7 + 0.3 * kissScale)}px Arial`;
      fctx.textAlign = 'center';
      fctx.textBaseline = 'middle';
      fctx.shadowColor = '#ff2f6b';
      fctx.shadowBlur = 18;
      fctx.fillText('💋', b.x, b.y - eased * 18);
      fctx.restore();
    }

    // tiny heart burst outward
    b.hearts.forEach(h => {
      const dist = h.speed * eased * 60;
      const hx = b.x + Math.cos(h.angle) * dist + h.drift * age * 0.02;
      const hy = b.y + Math.sin(h.angle) * dist - eased * 30;
      fctx.save();
      fctx.globalAlpha = Math.max(0, fade);
      fctx.font = `${h.size}px Arial`;
      fctx.textAlign = 'center';
      fctx.textBaseline = 'middle';
      fctx.fillStyle = '#ff4d7e';
      fctx.shadowColor = '#ff2f6b';
      fctx.shadowBlur = 8;
      fctx.fillText('❤', hx, hy);
      fctx.restore();
    });
  });

  requestAnimationFrame(drawFx);
}

requestAnimationFrame(drawBokeh);
requestAnimationFrame(drawRain);
requestAnimationFrame(drawTextLayer);
requestAnimationFrame(drawFx);

function resetSequence() {
  startTime = null;
  finalReached = false;
  glowEl.style.opacity = '0';
  sceneEl.classList.remove('breathe');
  rctx.clearRect(0, 0, rainCanvas.width, rainCanvas.height);
  initRain();
  rainFrame = 0;
  tapEl.classList.remove('show');
  tapEl.style.opacity = '';
  replayBtn.classList.remove('show');
  kissBursts = [];
}

// Tap anywhere on the final scene = send a kiss (does NOT replay/reset)
document.body.addEventListener('click', (e) => {
  if (finalReached) {
    spawnKissBurst(e.clientX, e.clientY);
  }
});

// Dedicated small button = replay from the start
replayBtn.addEventListener('click', (e) => {
  e.stopPropagation();
  resetSequence();
});
</script>

</body>
</html>
